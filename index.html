<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bongo Stream - The Ultimate Music Experience</title>
    <meta name="description" content="Discover, stream, and support your favorite Bongo Flava artists with Bongo Stream.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #ff007f;
            --bg-color: #0d0d12;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            left: -200px;
            opacity: 0.15;
            filter: blur(60px);
            animation: float1 15s ease-in-out infinite alternate;
            z-index: -1;
        }

        .bg-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            opacity: 0.15;
            filter: blur(60px);
            animation: float2 12s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes float1 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 50px); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-80px, -60px); }
        }

        /* Navigation */
        nav {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            margin-top: -5vh;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 4rem 3rem;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-weight: 300;
            line-height: 1.6;
            max-width: 600px;
            margin-inline: auto;
        }

        .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.2);
        }

        .btn-primary:hover {
            box-shadow: 0 15px 30px rgba(255, 0, 127, 0.4);
            transform: scale(1.05);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--surface-border);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .glass-card { padding: 3rem 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <nav>
        <div class="logo">Bongo Stream</div>
    </nav>

    <main class="hero">
        <div class="glass-card">
            <h1>The Heartbeat of <br><span class="gradient-text">Tanzanian Music</span></h1>
            <p>Discover, stream, and experience the best Bongo Flava hits in high quality. Connect with artists and listen to the pulse of Africa.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary" onclick="alert('Google Play link coming soon!')">Get on Google Play</a>
                <a href="#" class="btn btn-secondary" onclick="alert('Direct APK download link will be here')">Download APK</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bongo Stream. All rights reserved.</p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem;">
            <a href="/app-ads.txt" style="color: var(--text-muted); text-decoration: none;">AdMob Publisher Info</a>
        </p>
    </footer>
</body>
</html>
